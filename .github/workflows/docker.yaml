name: Docker
jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    if: '!contains(github.ref, ''main'') || (!contains(github.event.head_commit.message, ''skip docker'') && !contains(github.event.head_commit.message,
      ''docker skip''))'
    steps:
    - name: Code checkout
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.inputs.ref }}
        persist-credentials: false
    - name: Docker metadata
      id: docker_meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        flavor: |
          latest=false
        tags: |
          type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.action == 'published' && github.event.release.prerelease == false }}
          type=ref,event=tag
          type=ref,event=branch
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v4.3.0
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4.3.0
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Get Build Information
      id: build_info
      run: |
        {
          echo "version_tag=${GITHUB_REF/refs\/tags\/v/}"
          echo "short_sha=$(git rev-parse --short HEAD)"
          echo "sha=$(git rev-parse HEAD)"
        } >> "$GITHUB_OUTPUT"
    - name: Build and Push (tag)
      uses: docker/build-push-action@v7.3.0
      if: github.event_name == 'release' && github.event.action == 'published'
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          VERSION=${{ steps.build_info.outputs.version_tag }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        tags: ${{ steps.docker_meta.outputs.tags }}
    - name: Build and Push (main)
      uses: docker/build-push-action@v7.3.0
      if: github.event_name == 'push' && contains(github.ref, 'main')
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/amd64,linux/arm64
        build-args: |
          VERSION=dev-${{ steps.build_info.outputs.short_sha }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Build and Push (feature branch)
      uses: docker/build-push-action@v7.3.0
      if: github.event_name == 'workflow_dispatch'
      with:
        context: .
        file: ./Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        build-args: |
          VERSION=dev-${{ steps.build_info.outputs.short_sha }}
        labels: |
          ${{ steps.docker_meta.outputs.labels }}
          org.opencontainers.image.revision=${{ steps.build_info.outputs.sha }}
          org.opencontainers.image.version=dispatch-${{ steps.build_info.outputs.short_sha }}
        tags: ghcr.io/${{ github.repository }}:dispatch-${{ steps.build_info.outputs.short_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    timeout-minutes: 60
'on':
  push:
    branches:
    - main
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to run workflow against
        required: false
        default: main
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
