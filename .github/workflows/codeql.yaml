name: CodeQL
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
        - go
    steps:
    - name: Code Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.1
        cache: true
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: manual
    - name: Build locked Go source
      run: go build -mod=readonly ./...
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.0
    timeout-minutes: 40
'on':
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
