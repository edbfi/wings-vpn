# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/

# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# Local hooks — Go quality gates.
# Local tools are pinned separately from application dependencies; use Go 1.27.1.
# CI keeps Linux builds and native macOS checks explicit.
[[repos]]
repo = "local"
hooks = [
  { id = "gofumpt", name = "gofumpt", entry = "go tool -modfile=.github/tools/go.mod gofumpt -w", language = "system", types = ["go"] },
  { id = "golangci-lint", name = "Go lint regression gate", entry = "python3 .github/scripts/lint.py", language = "system", types = ["go"], pass_filenames = false },
  { id = "go-build", name = "go build", entry = "env GOOS=linux CGO_ENABLED=0 go build ./...", language = "system", types = ["go"], pass_filenames = false },
]
