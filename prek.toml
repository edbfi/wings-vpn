# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.2"
default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit", "manual"]

# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# Local hooks — project-specific quality gates
# Go tools are pinned in tools/go.mod; the build targets Linux.
[[repos]]
repo = "local"
hooks = [
  { id = "gofumpt", name = "gofumpt", entry = "go tool -modfile=tools/go.mod gofumpt -w", language = "system", types = ["go"] },
  { id = "golangci-lint", name = "Go lint regression gate", entry = "python3 scripts/lint.py", language = "system", pass_filenames = false, files = "(\\.go$|(^|/)go\\.(mod|sum)$|^\\.golangci\\.|^scripts/(lint\\.py|lint-baseline\\.json)$)" },
  { id = "go-build", name = "go build", entry = "env GOOS=linux CGO_ENABLED=0 go build ./...", language = "system", pass_filenames = false, files = "(\\.go$|(^|/)go\\.(mod|sum)$|^\\.golangci\\.|^scripts/(lint\\.py|lint-baseline\\.json)$)" },
]
